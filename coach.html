<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FC풉살 드래프트 보드 (코치 전용)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css?v=0919c1f5">
</head>
<body>

<!-- 로그인 게이트 -->
<div class="gate" id="gate">
  <div id="kakaoExitGate"></div>
  <div class="gate-card">
    <h1>⚽ 코치 드래프트 보드</h1>
    <p class="hint">개별 전달받은 8자리 암호를 입력해주세요.</p>
    <div class="mt">
      <input class="input" id="pass" placeholder="암호 8자리" autocomplete="off"
             onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="mt"><button class="btn block" id="btnLogin" onclick="login()">입장하기</button></div>
    <div class="err mt hidden" id="loginErr"></div>
    <p class="hint mt" style="font-size:12px">이 화면은 코치 전용입니다. 선수들에게는 진행률만 공개돼요.</p>
  </div>
</div>

<!-- 보드 -->
<div class="ws hidden" id="board">
  <aside class="sidebar">
    <div class="ws-head">
      <div>
        <div class="ws-name">⚽ FC풉살</div>
        <div class="ws-sub" id="sbWho">—</div>
      </div>
    </div>
    <nav class="channels">
      <div class="ch-label">코치 전용</div>
      <button class="ch active"><span class="hash">#</span>드래프트보드</button>
      <button class="ch" onclick="location.href='index.html'"><span class="hash">#</span>선수 화면 보기</button>
      <div class="ch-label" style="margin-top:12px">내 팀</div>
      <div style="padding:0 10px" id="sbRoster"></div>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div id="kakaoExit"></div>
      <div class="ws-name">⚽ FC풉살 <span style="font-weight:400;opacity:.7;font-size:13px" id="tbWho"></span></div>
      <div class="topbar-channels">
        <button class="ch active"><span class="hash">#</span>드래프트보드</button>
        <button class="ch" onclick="location.href='index.html'"><span class="hash">#</span>선수 화면</button>
      </div>
    </div>

    <header class="ch-head">
      <div class="ch-title"># 드래프트보드</div>
      <div class="ch-desc">코치 전용 · 선수에게는 진행률과 팀 차례만 공개됩니다</div>
    </header>

    <div class="pane wide" id="pane"></div>
  </main>
</div>

<script src="assets/config.js?v=0919c1f5"></script>
<script src="assets/character.js?v=0919c1f5"></script>
<script src="assets/app.js?v=0919c1f5"></script>
<script>
const { api, store, snakeTeam, snakeSeq, snakeTrackHtml, colorFor, esc,
        LOOK_GROUPS, lookRowHtml, clampNum, syncStickyTop, isTyping, kakaoExitBannerHtml } = window.FDApp;
const C = window.FD;
const { charSvg } = window.FDChar;

// 카카오톡 인앱 브라우저면 배너로 탈출 경로를 보여준다 (게이트 · 보드 둘 다)
document.getElementById('kakaoExitGate').innerHTML = kakaoExitBannerHtml();

let PASS = null;
let ST = null;
let TEAMS = [];
let selected = null;
let CARDS = [];        // 코치 6명의 카드 (내 것 포함)
let myCard = null;     // 편집 중인 내 카드 { look, pledge }
let cardOpen = false;  // 꾸미기 패널 접힘/펼침
let MATCHES = [];       // 매치데이 3경기
let matchOrderDraft = null; // 편집 중인 경기 순서 (match id 배열), null 이면 서버 값 그대로

async function login() {
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('loginErr');
  const pass = document.getElementById('pass').value.trim();
  if (!pass) return;
  btn.disabled = true; btn.textContent = '확인 중…'; err.classList.add('hidden');
  try {
    ST = await api.coachState(pass);
    PASS = pass;
    store.set('coachpass', pass);
    TEAMS = await api.teams();
    await loadLooks();
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('board').classList.remove('hidden');
    document.getElementById('kakaoExit').innerHTML = kakaoExitBannerHtml();
    render();
    setInterval(() => {
      if (isTyping()) return; // 각오·매치 순서 입력 중엔 재렌더를 건너뛴다 — 자판이 닫히는 문제 방지
      refresh();
    }, 5000);
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hidden');
  } finally { btn.disabled = false; btn.textContent = '입장하기'; }
}

async function refresh() {
  try {
    ST = await api.coachState(PASS);
    await loadLooks();
    render();
  } catch { /* 일시적 오류는 무시 */ }
}

// 선수·코치가 직접 꾸민 캐릭터를 코치 보드에도 그대로 보여준다.
// 코치 이름은 선수 이름과 겹치지 않아 한 맵에 같이 담아도 안전하다.
async function loadLooks() {
  try {
    const [looks, cards] = await Promise.all([
      api.looks().catch(() => ({})), api.coachCards().catch(() => []),
    ]);
    CARDS = cards;
    window.FDChar.setLooks({ ...looks, ...api.looksFromCards(cards) });
    const mine = cards.find((c) => c.coach_id === ST.coach.id);
    // 편집 중이 아닐 때만 서버 값으로 맞춘다 — 5초 폴링이 입력을 덮지 않게
    if (mine && !cardOpen) {
      myCard = { look: mine.look || window.FDChar.getLook(ST.coach.name), pledge: mine.pledge || '' };
    }
  } catch { /* 없으면 기본 모습 */ }
  // 매치 순서권 카드에 쓸 경기 목록. 순서를 편집 중일 때는 폴링이 덮지 않게 한다.
  try {
    MATCHES = await api.matches();
    if (!matchOrderDraft) matchOrderDraft = MATCHES.map((m) => m.id);
  } catch { /* 아직 경기가 없으면 무시 */ }
}

const teamOf = (c) => TEAMS.find((t) => t.code === c) || { name: c, color: '#888', coaches: '' };

function render() {
  const me = ST.coach;
  document.getElementById('sbWho').textContent =
    me.is_master ? '마스터' : `${me.name} 코치 · ${teamOf(me.team).name}`;
  document.getElementById('tbWho').textContent = '· ' + (me.is_master ? '마스터' : me.name + ' 코치');

  const order = ST.draft_order;
  const cur = ST.cursor;
  const done = cur >= C.TOTAL_PICKS;
  const nowTeam = order && !done ? snakeTeam(order, cur) : null;
  const myTurn = nowTeam && (me.is_master || me.team === nowTeam);

  // 사이드바: 내 팀 명단
  const mine = ST.picks.filter((p) => p.team === (me.team || nowTeam));
  document.getElementById('sbRoster').innerHTML = mine.length
    ? mine.map((p) => `<div style="color:#fff;font-size:13px;padding:3px 0">${esc(p.player)}</div>`).join('')
    : '<div style="color:var(--sidebar-text);font-size:12.5px">아직 없어요</div>';

  // 드래프트 단계가 아니어도 내 카드와 선수 화면 링크는 보여야 한다.
  // 카드는 오히려 투표 전에 채워야 선수 투표 화면에 나가므로, 여기서 가장 중요하다.
  if (ST.phase !== 'DRAFT') {
    const voting = ST.phase === 'VOTE';
    document.getElementById('pane').innerHTML = `
      <div class="card">
        <h3>${voting ? '지금은 투표 기간이에요' : '지금은 드래프트 단계가 아니에요'}</h3>
        <p class="hint mt">현재 단계: <b>${esc(C.PHASE_LABEL[ST.phase] || ST.phase)}</b>.
        ${voting
          ? '선수들이 가고 싶은 팀에 투표하는 중이에요. 투표가 끝나면 지명 순서가 정해집니다.'
          : '마스터가 드래프트를 열면 이 화면에서 지명할 수 있어요.'}</p>
        ${voting ? `<div class="mt">
          <div class="row"><span class="hint">투표 참여</span><span class="spacer"></span>
            <b>${ST.vote_count} / ${ST.players.length}명</b></div>
          <div class="progress mt" style="margin-top:6px">
            <i style="width:${Math.round((ST.vote_count / ST.players.length) * 100)}%"></i></div>
        </div>` : ''}
      </div>
      ${myCardHtml()}
      ${matchOrderCardHtml()}
      ${playerViewCard()}
      ${done ? resultCard() : ''}`;
  syncStickyTop();   // topbar 높이를 재서 고정 미리보기가 겹치지 않게 한다
    return;
  }

  const drafted = ST.picks.map((p) => p.player);
  const pool = ST.players.filter((p) => !drafted.includes(p));

  document.getElementById('pane').innerHTML = `
    <div class="turn-banner ${myTurn ? 'mine' : ''}">
      <div>
        <div class="big">${done ? `✅ ${C.TOTAL_PICKS}픽 완료!`
          : myTurn ? `👉 지금 우리 팀 차례예요` : `현재 턴: ${esc(teamOf(nowTeam).name)}`}</div>
        <div style="font-size:13px;opacity:.9;margin-top:2px">${cur} / ${C.TOTAL_PICKS}픽 진행</div>
      </div>
      <span class="spacer"></span>
      ${done ? '' : `<button class="btn ghost small" style="background:#fff" onclick="copyHandoff()">📋 다음 팀 알림 문구 복사</button>`}
    </div>

    ${order ? `<div class="card mt">
      <div class="row">
        <h3 style="margin:0">뽑는 순서</h3>
        <span class="spacer"></span>
        <span class="hint">${done ? '모두 끝' : `다음 → <b>${esc(teamOf(snakeTeam(order, Math.min(cur + 1, C.TOTAL_PICKS - 1))).name)}</b>`}</span>
      </div>
      <div class="mt">${snakeTrackHtml(order, cur, TEAMS)}</div>
    </div>` : ''}

    ${myCardHtml()}
    ${matchOrderCardHtml()}
    ${playerViewCard()}

    <div class="board">
      <div class="card">
        <h3>선수 풀 <span class="hint" style="font-weight:600">· 남은 ${pool.length}명</span></h3>
        <p class="hint" style="margin:4px 0 12px">
          탭하면 지명·찜·원픽을 고를 수 있어요. 💬는 선수가 남긴 각오 한마디입니다.</p>
        <div class="grid-players">
          ${pool.map((p) => poolCardHtml(p)).join('')}
        </div>
      </div>

      <div>
        <div class="card">
          <h3>팀 현황</h3>
          ${TEAMS.map((t) => {
            const members = ST.picks.filter((p) => p.team === t.code);
            // 총 인원이 팀 수로 안 나눠떨어져 팀마다 최종 인원이 다르다 — 실제 스네이크
            // 순번에서 이 팀이 몇 번 나오는지 세어 정확한 목표 칸 수를 구한다.
            const slots = order ? snakeSeq(order).filter((c) => c === t.code).length
              : Math.ceil(C.TOTAL_PICKS / TEAMS.length);
            return `<div style="margin-top:12px">
              <div class="row" style="gap:6px">
                <span class="team-swatch" style="width:14px;height:14px;background:${t.color}"></span>
                <b style="font-size:14px">${esc(t.name)}</b>
                <span class="hint">${members.length}/${slots}</span>
              </div>
              <div class="roster-grid" style="grid-template-columns:repeat(3,1fr);margin-top:6px">
                ${Array.from({ length: slots }, (_, i) => members[i]
                  ? `<div class="roster-slot" style="font-size:13px;padding:9px 4px">${esc(members[i].player)}</div>`
                  : `<div class="roster-slot empty" style="font-size:12px;padding:9px 4px">대기</div>`).join('')}
              </div>
            </div>`;
          }).join('')}
        </div>

        <div class="card">
          <h3>픽 로그</h3>
          <div class="log mt">
            ${ST.picks.length === 0 ? '<p class="hint">아직 픽이 없어요.</p>'
              : ST.picks.slice().reverse().map((p) => `<div class="log-row">
                  <span class="log-seq">#${p.seq + 1}</span>
                  <span style="color:${teamOf(p.team).color};font-weight:800">${esc(teamOf(p.team).name)}</span>
                  <span class="spacer"></span><b>${esc(p.player)}</b></div>`).join('')}
          </div>
          ${ST.picks.length ? `<div class="mt"><button class="btn ghost small" onclick="undo()">방금 픽 취소</button></div>` : ''}
        </div>
      </div>
    </div>

    ${done ? resultCard() : ''}
    <div class="overlay hidden" id="modal"></div>`;
  syncStickyTop();
}

function poolCardHtml(p) {
  const wishes = ST.wishes.filter((w) => w.player === p);
  const pledge = ST.pledges[p];
  const absent = (ST.absentees || []).includes(p);
  return `<div class="pcard" onclick="openModal('${esc(p)}')">
    <span class="chr-wrap">${charSvg(p, { size: 42 })}</span>
    ${esc(p)}
    ${absent ? `<span class="done" style="color:var(--red)">🚫 불참</span>` : ''}
    ${wishes.length ? `<div class="wish">${wishes.map((w) =>
      `<span class="wtag" style="background:${w.kind === 'super' ? '#1d1c1d' : teamOf(w.team).color};
        ${w.kind === 'super' ? 'color:#ECB22E;border:1px solid #ECB22E' : ''}">
        ${w.kind === 'super' ? '🔥' : ''}${esc(w.coach_name)}</span>`).join('')}</div>` : ''}
    ${pledge ? `<span class="bubble">💬 ${esc(pledge)}</span>` : ''}
  </div>`;
}

// ── 내 카드 (코치도 표를 받는다) ──────────────────────
// 선수 투표 화면의 팀 선택 아래에 이 캐릭터와 각오가 그대로 나간다.
function myCardHtml() {
  if (!myCard) return '';
  const me = ST.coach;
  const t = teamOf(me.team);
  return `<div class="card mt">
    <div class="row">
      <h3 style="margin:0">내 카드</h3>
      <span class="spacer"></span>
      <button class="btn small ghost" onclick="toggleCard()">${cardOpen ? '접기' : '꾸미기'}</button>
    </div>
    <p class="hint" style="margin:4px 0 10px">선수들이 <b>투표 화면</b>에서 팀을 고를 때
      이 캐릭터와 각오를 봅니다. 코치도 표를 받는 입장이에요.</p>

    <div class="row" style="align-items:center;gap:10px">
      <span id="lookPreview">${charSvg(me.name, { size: 56, look: myCard.look, crop: false })}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:800">${esc(me.name)} 코치
          <span class="hint" style="font-weight:600">· ${esc(t.name)}</span></div>
        <input class="input mt" id="coachPledge" maxlength="40"
               placeholder="예) 제발 우리 팀 뽑아주세요! 간식 쏩니다 🍫"
               value="${esc(myCard.pledge)}" oninput="myCard.pledge=this.value">
      </div>
    </div>

    ${cardOpen ? `<div class="look-editor"><div class="stage-stick"><div class="chr-stage" id="lookPreviewBig">
        ${charSvg(me.name, { size: 96, look: myCard.look, crop: false })}</div></div>
      ${LOOK_GROUPS.map((g) => `<div class="look-group">${esc(g.title)}</div>
        ${g.rows.map((r) => lookRowHtml(r.k, r.name, myCard.look, 'setCardLook')).join('')}`).join('')}</div>` : ''}

    <div class="row mt" style="gap:8px">
      <button class="btn small" id="btnCard" onclick="saveCard()">저장하기</button>
      ${cardOpen ? '<button class="btn small ghost" onclick="randomCardLook()">🎲 랜덤</button>' : ''}
      <span class="ok hidden" id="cardOk">저장했어요 ✓</span>
      <span class="err hidden" id="cardErr"></span>
    </div>
  </div>`;
}

// 선수가 보는 화면을 그대로 열어준다 — 같은 페이지라 "똑같이" 가 보장된다
function playerViewCard() {
  return `<div class="card mt">
    <div class="row">
      <h3 style="margin:0">선수 화면 보기</h3>
      <span class="spacer"></span>
      <span class="chip">선수와 똑같이</span>
    </div>
    <p class="hint" style="margin:4px 0 12px">선수 ${ST.players.length}명이 지금 보고 있는 화면을 그대로 엽니다.
      투표 현황·대기장·각오 한마디·팀 명단까지 같은 화면이에요.
      <b>드래프트 진행 상황은 선수 화면에 나가지 않습니다</b> — 진행 수와 팀 차례만 보여요.</p>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <button class="btn small" onclick="window.open('index.html','_blank')">새 탭으로 열기</button>
      <button class="btn small ghost" onclick="location.href='index.html'">이 탭에서 열기</button>
    </div>
  </div>`;
}

// 등번호는 입력 중이라 전체 렌더를 돌리면 포커스가 날아간다.
// 값만 반영하고 미리보기 두 곳만 갈아끼운다.
function onNumInput(el) {
  if (!myCard) return;
  myCard.look.nu = clampNum(el);
  const me = ST.coach;
  const small = document.getElementById('lookPreview');
  const big = document.getElementById('lookPreviewBig');
  if (small) small.innerHTML = charSvg(me.name, { size: 56, look: myCard.look, crop: false });
  if (big) big.innerHTML = charSvg(me.name, { size: 96, look: myCard.look, crop: false });
}

function toggleCard() { cardOpen = !cardOpen; render(); syncStickyTop(); }
function setCardLook(k, v) { myCard.look[k] = v; render(); }
function randomCardLook() { myCard.look = window.FDChar.randomLook(); render(); }

async function saveCard() {
  const btn = document.getElementById('btnCard');
  const ok = document.getElementById('cardOk');
  const err = document.getElementById('cardErr');
  btn.disabled = true; btn.textContent = '저장 중…';
  ok.classList.add('hidden'); err.classList.add('hidden');
  try {
    await api.coachSetCard(PASS, myCard.look, myCard.pledge.trim());
    await loadLooks();
    render();
    document.getElementById('cardOk')?.classList.remove('hidden');
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hidden');
  } finally {
    const b2 = document.getElementById('btnCard');
    if (b2) { b2.disabled = false; b2.textContent = '저장하기'; }
  }
}

// ── 매치 순서권 (투표 1위 팀 특전) ────────────────────
// 실력에 영향 없는 비전력 보상 — 매치데이 세 경기를 어떤 순서로 뛸지
// 투표 1위 팀 코치가 정한다. 마스터도 대신 정해줄 수 있다.
function matchOrderCardHtml() {
  const order = ST.draft_order;
  if (!order || !MATCHES.length) return '';
  const topTeam = order[0];
  const me = ST.coach;
  const mine = me.is_master || me.team === topTeam;
  if (!mine) return '';

  const byId = Object.fromEntries(MATCHES.map((m) => [m.id, m]));
  const seq = matchOrderDraft || MATCHES.map((m) => m.id);
  const dirty = JSON.stringify(seq) !== JSON.stringify(MATCHES.slice().sort((a, b) => (a.match_order ?? a.id) - (b.match_order ?? b.id)).map((m) => m.id));

  return `<div class="card mt">
    <div class="row">
      <h3 style="margin:0">매치 순서권 🥇</h3>
      <span class="spacer"></span>
      <span class="pride-badge">투표 1위 특전</span>
    </div>
    <p class="hint" style="margin:4px 0 12px">매치데이 세 경기를 어떤 순서로 진행할지
      ${esc(teamOf(topTeam).name)}이 정합니다. 화살표로 순서를 바꾸고 저장하세요.</p>
    <div class="mo-list">
      ${seq.map((id, i) => {
        const m = byId[id]; if (!m) return '';
        return `<div class="mo-row">
          <span class="mo-no">${i + 1}</span>
          <span class="mo-teams">${esc(teamOf(m.home).name)} <span class="hint">vs</span> ${esc(teamOf(m.away).name)}</span>
          <span class="mo-arrows">
            <button class="btn small ghost" ${i === 0 ? 'disabled' : ''} onclick="moveMatchOrder(${i},-1)">▲</button>
            <button class="btn small ghost" ${i === seq.length - 1 ? 'disabled' : ''} onclick="moveMatchOrder(${i},1)">▼</button>
          </span>
        </div>`;
      }).join('')}
    </div>
    <div class="row mt" style="gap:8px">
      <button class="btn small" ${dirty ? '' : 'disabled'} onclick="saveMatchOrder()">이 순서로 저장</button>
      <span class="ok hidden" id="moOk">저장했어요 ✓</span>
      <span class="err hidden" id="moErr"></span>
    </div>
  </div>`;
}

function moveMatchOrder(i, dir) {
  const seq = (matchOrderDraft || MATCHES.map((m) => m.id)).slice();
  const j = i + dir;
  if (j < 0 || j >= seq.length) return;
  [seq[i], seq[j]] = [seq[j], seq[i]];
  matchOrderDraft = seq;
  render();
}

async function saveMatchOrder() {
  const ok = document.getElementById('moOk');
  const err = document.getElementById('moErr');
  ok?.classList.add('hidden'); err?.classList.add('hidden');
  try {
    await api.coachSetMatchOrder(PASS, matchOrderDraft);
    matchOrderDraft = null; // 서버 값으로 다시 채우게 한다
    await loadLooks();
    render();
    document.getElementById('moOk')?.classList.remove('hidden');
  } catch (e) {
    if (err) { err.textContent = e.message; err.classList.remove('hidden'); }
  }
}

function resultCard() {
  return `<div class="card mt">
    <h3>✅ ${C.TOTAL_PICKS}픽이 모두 끝났어요</h3>
    <p class="hint mt">명단을 눈으로 한 번 확인한 뒤, 마스터가 <b>관리자 화면</b>에서 "결과 공개"를 눌러야
      선수들에게 가나다순 명단이 공개됩니다. 그 전까지는 아무에게도 보이지 않아요.</p>
  </div>`;
}

// ── 지명 모달 ──────────────────────────────────────────
function openModal(player) {
  selected = player;
  const me = ST.coach;
  const order = ST.draft_order;
  const nowTeam = order ? snakeTeam(order, ST.cursor) : null;
  const myTurn = nowTeam && (me.is_master || me.team === nowTeam);
  const myWish = ST.wishes.find((w) => w.player === player && w.coach === me.id);
  const pledge = ST.pledges[player];

  document.getElementById('modal').innerHTML = `
    <div class="modal">
      <div class="chr-wrap">${charSvg(player, { size: 72 })}</div>
      <h3 class="center">${esc(player)}</h3>
      ${pledge ? `<p class="hint center" style="margin-top:6px">💬 “${esc(pledge)}”</p>` : ''}
      <div class="stack mt">
        ${myTurn ? `<button class="btn" onclick="pick()">이 선수 지명하기</button>`
          : `<p class="hint">지금은 ${esc(teamOf(nowTeam).name)} 차례라 지명할 수 없어요.</p>`}
        ${me.is_master ? '' : `
          <button class="btn ghost" onclick="wish('super')"
            style="background:#1d1c1d;color:#ECB22E;border-color:#ECB22E">
            ${myWish && myWish.kind === 'super' ? '🔥 원픽 해제' : '🔥 원픽 지정 (코치당 1명)'}</button>
          <button class="btn ghost" onclick="wish('normal')">
            ${myWish && myWish.kind === 'normal' ? '👀 찜 해제' : '👀 찜하기'}</button>`}
        <button class="btn ghost" onclick="closeModal()">닫기</button>
      </div>
      <div class="err mt hidden" id="modalErr"></div>
    </div>`;
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal() { document.getElementById('modal')?.classList.add('hidden'); }

async function pick() {
  try { ST = await api.coachPick(PASS, selected); closeModal(); render(); }
  catch (e) { showModalErr(e.message); }
}

async function wish(kind) {
  try { ST = await api.coachWish(PASS, selected, kind); closeModal(); render(); }
  catch (e) { showModalErr(e.message); }
}

async function undo() {
  if (!confirm('방금 지명한 픽을 취소할까요?')) return;
  try { ST = await api.coachUndo(PASS); render(); }
  catch (e) { alert(e.message); }
}

function showModalErr(msg) {
  const el = document.getElementById('modalErr');
  if (el) { el.textContent = msg; el.classList.remove('hidden'); }
}

// 카톡으로 다음 팀을 부를 때 쓰는 문구
function copyHandoff() {
  const order = ST.draft_order;
  const next = order ? snakeTeam(order, ST.cursor) : null;
  const me = ST.coach;
  const text = next
    ? `${teamOf(next).name} 코치님, ${me.team ? teamOf(me.team).name + ' ' : ''}픽 끝났습니다! 이제 ${teamOf(next).name} 차례예요 🙏 (${ST.cursor}/${C.TOTAL_PICKS})`
    : '드래프트가 모두 끝났습니다!';
  navigator.clipboard?.writeText(text).then(
    () => alert('복사했어요!\n\n' + text),
    () => prompt('아래 문구를 복사해 코치방에 붙여넣어 주세요', text)
  );
}

// 이전 접속 암호 자동 채움
const saved = store.get('coachpass');
if (saved) { document.getElementById('pass').value = saved; }
</script>
</body>
</html>
