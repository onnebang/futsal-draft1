<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FC풉살 하반기 내부매치 드래프트</title>
<meta name="description" content="FC풉살 2026 하반기 내부매치 드래프트 — 선호팀 투표부터 팀 발표, 우승 예측까지">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="ws">
  <!-- 사이드바 (데스크톱) -->
  <aside class="sidebar">
    <div class="ws-head">
      <div>
        <div class="ws-name">⚽ FC풉살</div>
        <div class="ws-sub" id="sbPhase">불러오는 중…</div>
      </div>
    </div>
    <nav class="channels" id="channels"></nav>
  </aside>

  <main class="main">
    <!-- 상단 바 (모바일) -->
    <div class="topbar">
      <div class="ws-name">⚽ FC풉살 <span style="font-weight:400;opacity:.7;font-size:13px" id="tbPhase"></span></div>
      <div class="topbar-channels" id="channelsMobile"></div>
    </div>

    <header class="ch-head">
      <div class="ch-title" id="chTitle"># 투표</div>
      <div class="ch-desc" id="chDesc"></div>
    </header>

    <div class="pane" id="pane">
      <div class="card"><div class="hint">불러오는 중…</div></div>
    </div>
  </main>
</div>

<script src="assets/config.js"></script>
<script src="assets/character.js"></script>
<script src="assets/app.js"></script>
<script>
const { api, store, snakeTeam, snakeSeq, colorFor, esc, timeAgo, shuffled, confetti } = window.FDApp;
const C = window.FD;
const { charSvg } = window.FDChar;

const CHANNELS = [
  { id: 'vote',    name: '투표',      min: 1, desc: '가고 싶은 팀에 투표하면 드래프트 순서가 정해져요' },
  { id: 'avatar',  name: '내캐릭터',  min: 1, desc: '나를 닮은 선수를 직접 꾸며보세요 — 코치 화면에도 그대로 나옵니다' },
  { id: 'reveal',  name: '결과발표',  min: 2, desc: '투표 결과로 정해진 드래프트 지명 순서' },
  { id: 'draft',   name: '드래프트',  min: 3, desc: '코치들이 팀을 고르는 중 — 진행 상황만 공개돼요' },
  { id: 'team',    name: '우리팀',    min: 4, desc: '확정된 3팀 명단 (가나다순)' },
  { id: 'predict', name: '예측',      min: 5, desc: '우승 팀을 예측하고 승률을 확인하세요' },
  { id: 'cheer',   name: '응원',      min: 4, desc: '팀별 응원 한마디' },
  { id: 'match',   name: '경기',      min: 6, desc: '12/19 매치 결과 · 순위표 · 예측 적중자' },
];

let S = {
  cfg: null, teams: [], players: [], marks: [], pledges: {}, looks: {},
  rosters: [], tally: null, comments: [], predictions: [], predictMarks: [],
  matches: [], standings: [],
  active: null, cheerTeam: 'A', celebrated: false,
};

const phaseIdx = (p) => C.PHASES.indexOf(p || 'SETUP');
const teamOf = (code) => S.teams.find((t) => t.code === code) || { name: code, color: '#888', coaches: '' };
const myName = () => store.get('name');

async function load() {
  S.cfg = await api.config();
  const [teams, players, marks, pledges, looks] = await Promise.all([
    api.teams(), api.players(), api.voteMarks(), api.pledges(), api.looks().catch(() => ({})),
  ]);
  Object.assign(S, { teams, players, marks, pledges, looks });
  // 등록해두면 이후 charSvg 호출이 전부 저장된 룩을 쓴다
  window.FDChar.setLooks(looks);

  const pi = phaseIdx(S.cfg.phase);
  if (pi >= 2) { try { S.tally = await api.voteTally(); } catch { S.tally = null; } }
  if (pi >= 4) { try { S.rosters = await api.rosters(); } catch { S.rosters = []; } }
  if (pi >= 4) { try { S.comments = await api.comments(); } catch { S.comments = []; } }
  if (pi >= 5) {
    try { S.predictions = await api.predictions(); S.predictMarks = await api.predictMarks(); } catch { /* 무시 */ }
  }
  if (pi >= 6) {
    try { S.matches = await api.matches(); S.standings = await api.standings(); } catch { /* 무시 */ }
  }

  if (!S.active) S.active = defaultChannel();
  render();
}

function defaultChannel() {
  const pi = phaseIdx(S.cfg.phase);
  const map = { 1: 'vote', 2: 'reveal', 3: 'draft', 4: 'team', 5: 'predict', 6: 'match' };
  return map[pi] || 'vote';
}

function unlocked(ch) { return phaseIdx(S.cfg.phase) >= ch.min; }

// ── 렌더 ───────────────────────────────────────────────
function render() {
  const label = C.PHASE_LABEL[S.cfg.phase] || '준비 중';
  document.getElementById('sbPhase').textContent = label;
  document.getElementById('tbPhase').textContent = '· ' + label;

  const navHtml = CHANNELS.map((ch) => {
    const open = unlocked(ch);
    const active = S.active === ch.id;
    const live = open && ch.id === defaultChannel();
    return `<button class="ch ${active ? 'active' : ''} ${open ? '' : 'locked'}"
              ${open ? `onclick="go('${ch.id}')"` : 'disabled'}>
              <span class="hash">${open ? '#' : '🔒'}</span>${esc(ch.name)}
              ${live && !active ? '<span class="dot"></span>' : ''}
            </button>`;
  }).join('');
  document.getElementById('channels').innerHTML =
    '<div class="ch-label">채널</div>' + navHtml;
  document.getElementById('channelsMobile').innerHTML = navHtml;

  const ch = CHANNELS.find((c) => c.id === S.active) || CHANNELS[0];
  document.getElementById('chTitle').textContent = '# ' + ch.name;
  document.getElementById('chDesc').textContent = ch.desc;

  const pane = document.getElementById('pane');
  if (S.cfg.phase === 'SETUP') {
    pane.innerHTML = `<div class="card center"><h3>곧 시작합니다</h3>
      <p class="hint mt">드래프트 준비 중이에요. 카톡 공지를 기다려주세요 🙏</p></div>`;
    return;
  }
  ({ vote: renderVote, avatar: renderAvatar, reveal: renderReveal, draft: renderDraft,
     team: renderTeam, predict: renderPredict, cheer: renderCheer, match: renderMatch }[ch.id])(pane);
}

function go(id) { S.active = id; render(); }

// ── #투표 ──────────────────────────────────────────────
let voteForm = { name: null, look: null, first: null, second: null, pledge: '' };

// 빈 칸 앞에서 막히지 않도록 — 눌러서 넣고 고쳐 쓰라고 던져주는 예시
// 짧게 유지할 것 — 길어지면 모바일에서 한 줄에 하나씩만 들어가 칩 목록이 화면을 다 먹는다
const PLEDGE_SAMPLES = [
  '체력 자신 있어요 🏃',
  '수비 책임질게요 🧱',
  '골 넣을게요 ⚽',
  '패스 잘 받아요 🙌',
  '분위기 메이커 📣',
];

function usePledge(i) {
  const t = PLEDGE_SAMPLES[i];
  if (t == null) return;
  voteForm.pledge = t;
  const el = document.getElementById('pledgeInput');
  if (el) { el.value = t; el.focus(); }
  syncPledgeUi();
}

// 입력할 때마다 다시 그리면 포커스가 날아가서, 필요한 부분만 직접 건드린다
function onPledgeInput(v) { voteForm.pledge = v; syncPledgeUi(); }

function syncPledgeUi() {
  const filled = voteForm.pledge.trim().length > 0;
  const btn = document.getElementById('btnVote');
  const help = document.getElementById('pledgeHelp');
  const count = document.getElementById('pledgeCount');
  if (btn) btn.disabled = !filled;
  if (help) help.textContent = filled ? '좋아요! 이제 제출하면 끝이에요' : '한 줄만 적으면 투표가 완료돼요';
  if (count) count.textContent = `${voteForm.pledge.length} / 40`;
}

function renderVote(pane) {
  const done = store.get('voted') === '1';
  const closed = S.cfg.phase !== 'VOTE';

  if (closed) {
    pane.innerHTML = `<div class="card">
      <h3>투표가 마감되었어요</h3>
      <p class="hint mt">참여해주신 ${S.marks.length}명, 감사합니다 💚
      결과는 <b># 결과발표</b> 채널에서 확인할 수 있어요.</p>
      <div class="mt"><button class="btn" onclick="go('reveal')">결과 보러 가기</button></div>
    </div>`;
    return;
  }

  if (done) {
    pane.innerHTML = `<div class="card">
      <h3>소중한 한 표 감사합니다 💚</h3>
      <p class="hint mt">${esc(myName() || '')}님의 투표가 정상적으로 접수되었어요.
      결과는 투표 마감 후 <b># 결과발표</b> 채널에서 공개됩니다.</p>
      ${progressHtml()}
      </div>
      ${loungeHtml('선수 대기장')}
      ${pledgeCardHtml()}`;
    return;
  }

  pane.innerHTML = `
    <div class="card">
      <h3>1. 내 이름을 선택해주세요</h3>
      <div class="privacy">
        <span class="lock">🔒</span>
        <div>
          <span class="ptitle">고른 팀은 이름과 따로 저장돼요</span>
          <p>“누가 투표했는지”와 “어느 팀을 골랐는지”는 서로 다른 곳에 나뉘어 담기고,
             둘을 이어붙일 열쇠가 <strong>아예 없습니다</strong>.
             투표한 시각도 남기지 않아서 순서로 되짚는 것도 불가능해요.</p>
          <p>그래서 <strong>이걸 만든 원배도, 코치 누구도</strong> 내가 어느 팀을 골랐는지 볼 수 없어요.
             마음 편히 솔직하게 골라주세요 💚</p>
        </div>
      </div>
      <div class="grid-players">
        ${S.players.map((p) => {
          const voted = S.marks.includes(p);
          return `<div class="pcard ${voted ? 'disabled' : ''} ${voteForm.name === p ? 'sel' : ''}"
                    ${voted ? '' : `onclick="pickName('${esc(p)}')"`}>
                    <span class="chr-wrap">${charSvg(p, { size: 44 })}</span>
                    ${esc(p)}${voted ? '<span class="done">투표 완료</span>' : ''}
                  </div>`;
        }).join('')}
      </div>
      ${progressHtml()}
    </div>

    <div class="card ${voteForm.name ? '' : 'hidden'}" id="stepLook">
      <h3>2. 내 캐릭터 꾸미기</h3>
      <p class="hint" style="margin:4px 0 0">코치들이 드래프트할 때 이 모습으로 보게 됩니다.
        나중에 <b>#내캐릭터</b> 채널에서 언제든 고칠 수 있어요.</p>
      <div class="chr-stage">${voteForm.name ? charSvg(voteForm.name, { size: 118, look: voteForm.look, crop: false }) : ''}</div>
      <div class="row" style="justify-content:center;margin-bottom:4px">
        <button class="btn small ghost" onclick="randomizeVoteLook()">🎲 랜덤으로 돌려보기</button>
      </div>
      ${voteForm.look ? LOOK_GROUPS.map((g) => `<div class="look-group">${esc(g.title)}</div>
        ${g.rows.map((r) => lookRowHtml(r.k, r.name, voteForm.look, 'setVoteLook')).join('')}`).join('') : ''}
    </div>

    <div class="card ${voteForm.name ? '' : 'hidden'}" id="stepTeams">
      <h3>3. 가고 싶은 팀을 골라주세요</h3>
      <p class="hint" style="margin:4px 0 12px">가장 많은 표를 받은 팀이 <b>드래프트 1번</b>으로 선수를 뽑습니다.</p>
      <div style="font-weight:800;font-size:13.5px;margin-bottom:8px">1순위 <span style="color:var(--red)">*필수</span></div>
      <div class="team-opts">${teamOptsHtml('first')}</div>
      <div style="font-weight:800;font-size:13.5px;margin:16px 0 8px">2순위 <span class="hint">(선택)</span></div>
      <div class="team-opts">${teamOptsHtml('second')}</div>
    </div>

    <div class="card ${voteForm.first ? '' : 'hidden'}">
      <h3>4. 각오 한마디 <span style="color:var(--red);font-size:13.5px">*필수</span></h3>
      <p class="hint" style="margin:4px 0 10px">코치들이 드래프트하는 내내 이 한 줄을 보면서 선수를 고릅니다.
        <b>나를 어필할 수 있는 유일한 칸</b>이에요. 이 항목만 이름이 함께 공개됩니다.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:10px">
        ${PLEDGE_SAMPLES.map((t, i) => `<button class="chip tap" onclick="usePledge(${i})">${esc(t)}</button>`).join('')}
      </div>
      <input class="input" id="pledgeInput" maxlength="40" placeholder="예) 뽑아주세요! 90분 내내 뛸 자신 있어요 💪"
             value="${esc(voteForm.pledge)}" oninput="onPledgeInput(this.value)">
      <div class="row mt">
        <span class="hint" id="pledgeHelp">${voteForm.pledge.trim() ? '좋아요! 이제 제출하면 끝이에요' : '한 줄만 적으면 투표가 완료돼요'}</span>
        <span class="spacer"></span>
        <span class="hint" id="pledgeCount">${voteForm.pledge.length} / 40</span>
      </div>
      <div class="mt"><button class="btn block" id="btnVote" onclick="submitVote()"
        ${voteForm.pledge.trim() ? '' : 'disabled'}>캐릭터 · 투표 · 각오 한번에 제출</button></div>
      <div class="err mt hidden" id="voteErr"></div>
    </div>`;
}

function teamOptsHtml(slot) {
  return S.teams.map((t) => {
    const sel = voteForm[slot] === t.code;
    return `<button class="team-opt ${sel ? 'sel' : ''}" style="${sel ? `color:${t.color}` : ''}"
              onclick="pickTeam('${slot}','${t.code}')">
              <span class="team-swatch" style="background:${t.color}"></span>
              <span><span class="tname">${esc(t.name)}</span><br><span class="tcoach">${esc(t.coaches)} 코치</span></span>
              ${sel ? '<span class="pick-no">선택됨</span>' : ''}
            </button>`;
  }).join('');
}

function progressHtml() {
  const pct = Math.round((S.marks.length / S.players.length) * 100);
  return `<div class="mt">
    <div class="row"><span class="hint">투표 참여</span><span class="spacer"></span>
      <b>${S.marks.length} / ${S.players.length}명</b></div>
    <div class="progress mt" style="margin-top:6px"><i style="width:${pct}%"></i></div>
  </div>`;
}

// 대기장 — 18명이 한 화면에 오밀조밀 모여 선다.
// 도착한 사람은 색이 있고 튀며, 아직 안 온 사람은 흐린 실루엣.
// 각오는 카드마다 달지 않고(세로로 너무 길어진다) 위쪽 말풍선 한 칸에서
// 한 명씩 돌아가며 말한다. 누르면 그 사람이 바로 말한다.
let speaker = null;     // 지금 말풍선에 나오는 사람
let speakHold = 0;      // 탭으로 고른 뒤 자동 순환을 잠시 멈추는 시각
let speakTimer = null;

function talkers() { return S.players.filter((p) => S.marks.includes(p) && S.pledges[p]); }

function startSpeakLoop() {
  if (speakTimer) return;
  speakTimer = setInterval(() => {
    if (Date.now() < speakHold) return;
    const t = talkers();
    if (!t.length) return;
    speaker = t[(t.indexOf(speaker) + 1) % t.length];
    paintSpeech();
  }, 3200);
}

function speak(name) {
  speaker = name;
  speakHold = Date.now() + 8000;
  paintSpeech();
}

function speechHtml() {
  const n = speaker;
  if (!n) {
    const t = talkers();
    return `<span class="hint">${t.length ? '…' : '아직 각오를 남긴 사람이 없어요. 첫 번째가 되어보세요!'}</span>`;
  }
  const arrived = S.marks.includes(n);
  const body = !arrived ? '아직 안 왔어요. 카톡으로 살짝 알려주세요 🙌'
             : (S.pledges[n] || '도착! 각오는 아직이에요');
  return `<span class="who">${esc(n)}</span><span class="say">${esc(body)}</span>`;
}

// 전체 렌더 없이 말풍선과 강조만 갈아끼운다 — 10초마다 오는 재렌더와 무관하게 부드럽다
function paintSpeech() {
  const el = document.getElementById('speech');
  if (!el) return;
  el.innerHTML = speechHtml();
  document.querySelectorAll('.crowd .cp').forEach((b) => b.classList.toggle('talking', b.dataset.name === speaker));
}

function loungeHtml(title) {
  const here = S.players.filter((p) => S.marks.includes(p));
  const left = S.players.filter((p) => !S.marks.includes(p));
  if (!speaker || !S.players.includes(speaker)) speaker = talkers()[0] || null;
  startSpeakLoop();

  return `<div class="card">
    <div class="row">
      <h3 style="margin:0">${esc(title)}</h3>
      <span class="spacer"></span>
      <span class="chip ${left.length ? 'live' : ''}">${here.length} / ${S.players.length}명</span>
    </div>
    <div class="speech" id="speech">${speechHtml()}</div>
    <div class="crowd">
      ${S.players.map((n) => {
        const arrived = S.marks.includes(n);
        return `<button class="cp ${arrived ? '' : 'away'} ${n === speaker ? 'talking' : ''}"
                  data-name="${esc(n)}" onclick="speak('${esc(n)}')">
          ${charSvg(n, { size: 32, bounce: arrived })}
          <span class="nm">${esc(n)}</span>
        </button>`;
      }).join('')}
    </div>
    <p class="hint" style="margin:10px 0 0">${left.length === 0
      ? '전원 도착! 이제 마감과 발표만 남았어요 🎉'
      : `<b>${left.length}명</b>이 아직이에요 · 캐릭터를 누르면 각오가 보여요`}</p>
    ${left.length ? `<div class="mt"><button class="btn small ghost" onclick="copyNudge()">카톡에 붙여넣을 문구 복사</button></div>` : ''}
  </div>`;
}

function copyNudge() {
  const left = S.players.filter((p) => !S.marks.includes(p));
  const text = left.length === 0
    ? '18명 전원 투표 완료했어요! 감사합니다 🎉'
    : `${left.join(', ')} 님 아직 투표 전이에요 🙌\n1분이면 끝나요. 캐릭터도 꾸미고 각오 한마디도 남겨주세요!\n${location.origin}${location.pathname}`;
  navigator.clipboard?.writeText(text).then(
    () => alert('복사했어요!\n\n' + text),
    () => prompt('아래 문구를 복사해 팀 단톡방에 붙여넣어 주세요', text)
  );
}

function pledgeCardHtml() {
  const name = myName();
  if (!name) return '';
  const cur = S.pledges[name] || '';
  return `<div class="card">
    <h3>각오 한마디 ${cur ? '고치기' : '남기기'}</h3>
    <p class="hint" style="margin:4px 0 10px">드래프트가 끝나기 전까지 언제든 고칠 수 있어요.
      더 좋은 문구가 떠올랐다면 지금 바꿔두세요.</p>
    <input class="input" id="pledgeLate" maxlength="40" value="${esc(cur)}" placeholder="예) 뽑아주세요! 열심히 뛸게요 💪">
    <div class="mt"><button class="btn small" onclick="savePledge()">저장</button>
      <span class="ok hidden" id="pledgeOk">저장했어요 ✓</span></div>
  </div>`;
}

function pickName(n) {
  voteForm.name = n;
  // 그 이름의 기본 캐릭터에서 시작한다 — 빈 화면보다 고치기가 쉽다
  voteForm.look = window.FDChar.getLook(n);
  render();
  document.getElementById('stepLook')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function setVoteLook(k, v) { voteForm.look[k] = v; render(); }
function randomizeVoteLook() { voteForm.look = window.FDChar.randomLook(); render(); }
function pickTeam(slot, code) {
  const wasEmpty = !voteForm.first;
  if (voteForm[slot] === code) voteForm[slot] = null;
  else {
    voteForm[slot] = code;
    const other = slot === 'first' ? 'second' : 'first';
    if (voteForm[other] === code) voteForm[other] = null;
  }
  render();
  if (wasEmpty && voteForm.first) {
    document.getElementById('pledgeInput')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

async function submitVote() {
  const btn = document.getElementById('btnVote');
  const err = document.getElementById('voteErr');
  const pledge = voteForm.pledge.trim();
  if (!voteForm.name || !voteForm.first) return;
  if (!pledge) {
    err.textContent = '각오 한마디를 한 줄 남겨주세요. 코치들이 이걸 보고 뽑아요!';
    err.classList.remove('hidden');
    document.getElementById('pledgeInput')?.focus();
    return;
  }
  btn.disabled = true; btn.textContent = '제출 중…'; err.classList.add('hidden');
  try {
    // 투표를 맨 마지막에 한다 — 1인 1회라 되돌릴 수 없기 때문에,
    // 앞의 둘이 실패하면 아무것도 잃지 않고 다시 누를 수 있어야 한다.
    if (voteForm.look) await api.submitLook(voteForm.name, voteForm.look);
    await api.submitPledge(voteForm.name, pledge);
    await api.submitVote(voteForm.name, voteForm.first, voteForm.second);
    store.set('name', voteForm.name); store.set('voted', '1');
    confetti();
    await load();
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hidden');
    if (e.code === 'ALREADY_VOTED') { store.set('voted', '1'); store.set('name', voteForm.name); setTimeout(load, 1200); }
  } finally { btn.disabled = false; btn.textContent = '캐릭터 · 투표 · 각오 한번에 제출'; }
}

// 팬심 60% + 전력 40% → 라운드로빈 몬테카를로
function winProbabilities() {
  const codes = S.teams.map((t) => t.code);
  if (!codes.length) return {};
  const fan = {}, pow = {};
  const total = S.predictions.length || 1;
  codes.forEach((c) => {
    fan[c] = S.predictions.filter((p) => p.rank1 === c).length / total;
    const r = S.rosters.find((x) => x.team === c);
    pow[c] = r && r.power ? Number(r.power) : 1;
  });
  const powSum = codes.reduce((s, c) => s + pow[c], 0) || 1;
  const strength = {};
  codes.forEach((c) => { strength[c] = 0.6 * fan[c] + 0.4 * (pow[c] / powSum); });

  const wins = Object.fromEntries(codes.map((c) => [c, 0]));
  const SIMS = 10000;
  for (let s = 0; s < SIMS; s++) {
    const pts = Object.fromEntries(codes.map((c) => [c, 0]));
    for (let i = 0; i < codes.length; i++) {
      for (let j = i + 1; j < codes.length; j++) {
        const a = codes[i], b = codes[j];
        const pa = 1 / (1 + Math.exp(-4 * (strength[a] - strength[b])));
        const r = Math.random();
        if (r < pa * 0.85) pts[a] += 3;
        else if (r < 0.85) pts[b] += 3;
        else { pts[a] += 1; pts[b] += 1; }
      }
    }
    const best = Math.max(...codes.map((c) => pts[c]));
    const leaders = codes.filter((c) => pts[c] === best);
    wins[leaders[Math.floor(Math.random() * leaders.length)]]++;
  }
  return Object.fromEntries(codes.map((c) => [c, wins[c] / SIMS]));
}

      <div class="reveal-team">🏆 ${esc(teamOf(champ).name)}</div>
      <div class="reveal-score">${esc(teamOf(champ).coaches)} 코치 · 우승을 축하합니다!</div>
    </div>` : ''}

    <div class="card">
      <h3>경기 결과</h3>
      <p class="hint" style="margin:4px 0 12px">${done} / ${S.matches.length}경기 종료 · 5:5 · 12분</p>
      ${S.matches.map((m) => {
        const h = teamOf(m.home), a = teamOf(m.away);
        const played = m.home_score != null;
        const hw = played && m.home_score > m.away_score;
        const aw = played && m.away_score > m.home_score;
        return `<div class="row" style="padding:11px 0;border-bottom:1.5px solid var(--border)">
          <span style="flex:1;text-align:right;font-weight:700;font-size:15px;${hw ? '' : 'opacity:.6'}">${esc(h.name)}</span>
          <span class="team-swatch" style="width:14px;height:14px;background:${h.color}"></span>
          <span style="font-weight:700;font-size:17px;min-width:64px;text-align:center">
            ${played ? `${m.home_score} : ${m.away_score}` : '<span class="hint">vs</span>'}</span>
          <span class="team-swatch" style="width:14px;height:14px;background:${a.color}"></span>
          <span style="flex:1;font-weight:700;font-size:15px;${aw ? '' : 'opacity:.6'}">${esc(a.name)}</span>
        </div>`;
      }).join('')}
    </div>

    <div class="card">
      <h3>순위표</h3>
      <div class="table-wrap mt" style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13.5px">
          <thead><tr style="color:var(--muted);font-size:12px">
            <th style="text-align:left;padding:6px 4px">팀</th>
            <th style="padding:6px 4px">경기</th><th style="padding:6px 4px">승</th>
            <th style="padding:6px 4px">무</th><th style="padding:6px 4px">패</th>
            <th style="padding:6px 4px">득실</th><th style="padding:6px 4px">승점</th>
          </tr></thead>
          <tbody>
            ${S.standings.map((r, i) => {
              const t = teamOf(r.code);
              return `<tr style="border-top:1.5px solid var(--border)">
                <td style="padding:9px 4px">
                  <span style="font-weight:700">${i + 1}. ${esc(t.name)}</span></td>
                <td style="text-align:center">${r.played}</td>
                <td style="text-align:center">${r.win}</td>
                <td style="text-align:center">${r.draw}</td>
                <td style="text-align:center">${r.loss}</td>
                <td style="text-align:center">${r.gd > 0 ? '+' : ''}${r.gd}</td>
                <td style="text-align:center;font-weight:700;font-size:15px">${r.pts}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    ${all ? winnersCardHtml() : `<div class="card">
      <h3>예측 적중자</h3>
      <p class="hint mt">모든 경기가 끝나면 적중자를 발표할게요 🎯</p></div>`}`;

  if (champ && !S.celebrated) { S.celebrated = true; confetti(); }
}

// 최종 순위를 정확히 맞힌 사람 / 우승팀만 맞힌 사람
function winnersCardHtml() {
  const order = S.standings.map((r) => r.code);
  const exact = S.predictions.filter((p) => p.rank1 === order[0] && p.rank2 === order[1] && p.rank3 === order[2]);
  const champOnly = S.predictions.filter((p) => p.rank1 === order[0] && !exact.includes(p));

  return `<div class="card">
    <h3>🎯 예측 적중자</h3>
    <p class="hint" style="margin:4px 0 12px">총 ${S.predictions.length}명이 예측에 참여했어요.</p>
    <div style="font-weight:700;font-size:15px;margin-bottom:6px">
      순위 3개 모두 적중 <span style="color:var(--green)">${exact.length}명</span></div>
    ${exact.length
      ? `<div class="row">${exact.map((p) =>
          `<span class="chip" style="background:rgba(0,163,122,.12);color:var(--green)">${esc(p.nickname || '익명')}</span>`).join('')}</div>`
      : '<p class="hint">아무도 맞히지 못했어요 😅</p>'}
    <div style="font-weight:700;font-size:15px;margin:16px 0 6px">
      우승팀 적중 <span style="color:var(--blue)">${champOnly.length}명</span></div>
    ${champOnly.length
      ? `<div class="row">${champOnly.map((p) =>
          `<span class="chip">${esc(p.nickname || '익명')}</span>`).join('')}</div>`
      : '<p class="hint">해당자가 없어요.</p>'}
  </div>`;
}

// ── #응원 ──────────────────────────────────────────────
function renderCheer(pane) {
  const list = S.comments.filter((c) => c.team === S.cheerTeam);
  pane.innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        ${S.teams.map((t) => `<button class="btn small ${S.cheerTeam === t.code ? '' : 'ghost'}"
            style="${S.cheerTeam === t.code ? `background:${t.color}` : ''}"
            onclick="S.cheerTeam='${t.code}';render()">${esc(t.name)}</button>`).join('')}
      </div>
      <p class="hint">팀 응원과 도발은 환영! 개인을 향한 실력 평가는 삼가주세요 💚</p>
      <div class="mt">
        <input class="input" id="cmtNick" maxlength="10" placeholder="닉네임" value="${esc(myName() || '')}">
        <textarea class="textarea mt" id="cmtBody" maxlength="200"
          placeholder="${esc(teamOf(S.cheerTeam).name)}에 응원 한마디!"></textarea>
        <div class="row mt"><button class="btn" onclick="submitComment()">보내기</button>
          <span class="err hidden" id="cmtErr"></span></div>
      </div>
    </div>
    <div class="card">
      <h3># ${esc(teamOf(S.cheerTeam).name)}</h3>
      <div class="mt">
        ${list.length === 0 ? '<p class="hint">첫 응원을 남겨보세요!</p>'
          : list.map((c) => msgHtml(c.nickname, c.body, null, timeAgo(c.created_at), false)).join('')}
      </div>
    </div>`;
}

async function submitComment() {
  const nick = document.getElementById('cmtNick').value.trim();
  const body = document.getElementById('cmtBody').value.trim();
  const err = document.getElementById('cmtErr');
  err.classList.add('hidden');
  if (!nick || !body) { err.textContent = '닉네임과 내용을 입력해주세요.'; err.classList.remove('hidden'); return; }
  try {
    await api.submitComment(S.cheerTeam, nick, body);
    document.getElementById('cmtBody').value = '';
    S.comments = await api.comments();
    render();
  } catch (e) { err.textContent = e.message; err.classList.remove('hidden'); }
}

// ── 시작 & 주기적 갱신 ─────────────────────────────────
load().catch((e) => {
  document.getElementById('pane').innerHTML =
    `<div class="card"><h3>연결에 실패했어요</h3><p class="hint mt">잠시 후 새로고침해주세요.</p>
     <p class="hint" style="font-size:11px;opacity:.6">${esc(e.message)}</p></div>`;
});
setInterval(() => { load().catch(() => {}); }, 10000);
</script>
</body>
</html>
